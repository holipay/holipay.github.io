<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>nase.me</title>
<meta name="description" content="nase.me AI深度分析全球金融、科技、社科资讯"/>
<meta name="robots" content="index,follow"/>
<meta name="theme-color" content="#f0f2f5" media="(prefers-color-scheme:light)"/>
<meta name="theme-color" content="#0f1117" media="(prefers-color-scheme:dark)"/>
<link rel="preload" as="fetch" href="data/news/analysis/index.json" crossorigin/>
<link rel="preload" as="fetch" href="data/news/meta.json" crossorigin/>
<style>
:root{--bg:#f0f2f5;--card:#fff;--text:#1a1a2e;--text2:#555;--text3:#999;--accent:#2563eb;--accent-h:#1d4ed8;--accent-l:#eff6ff;--accent-g:rgba(37,99,235,.15);--bdr:#e8e8e8;--sh:0 2px 8px rgba(0,0,0,.06);--sh-h:0 4px 16px rgba(0,0,0,.1);--r:12px;--rs:8px;--tr:.2s cubic-bezier(.4,0,.2,1);--side-w:260px}
@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#181b25;--text:#e8e8f0;--text2:#a0a0b8;--text3:#666680;--accent:#3b82f6;--accent-h:#60a5fa;--accent-l:#172554;--accent-g:rgba(59,130,246,.12);--bdr:#2a2d3a;--sh:0 2px 8px rgba(0,0,0,.25);--sh-h:0 4px 16px rgba(0,0,0,.35)}}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-h)}

/* Layout */
.layout{display:grid;grid-template-columns:1fr var(--side-w);height:100vh}
.main{overflow-y:auto;padding:24px 28px 40px;min-width:0;contain:layout style;max-width:860px;margin:0 auto}
.sidebar{border-left:1px solid var(--bdr);background:var(--card);overflow-y:auto;padding:0;contain:layout style;position:sticky;top:0;height:100vh}

/* Sidebar */
.side-section{padding:14px 16px;border-bottom:1px solid var(--bdr)}
.side-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}

.cat-list{padding:8px 0}
.cat-item{display:flex;align-items:center;gap:8px;padding:9px 16px;cursor:pointer;transition:background var(--tr);user-select:none;font-size:13px;color:var(--text)}
.cat-item:hover{background:var(--accent-l)}
.cat-item.active{background:var(--accent-l);color:var(--accent);font-weight:700}
.cat-icon{font-size:15px;flex-shrink:0;width:20px;text-align:center}
.cat-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-count{font-size:10px;color:var(--text3);background:var(--bg);padding:1px 6px;border-radius:100px;flex-shrink:0}

/* Cards */
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--sh);border:1px solid var(--bdr);margin-bottom:16px;content-visibility:auto;contain-intrinsic-size:auto 200px}
.empty{text-align:center;padding:80px 20px;color:var(--text3)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.6}

/* Skeleton */
.sk{animation:pulse 1.5s ease-in-out infinite}
.sk-card{background:var(--card);border-radius:var(--r);padding:20px;margin-bottom:16px;border:1px solid var(--bdr)}
.sk-line{height:14px;background:var(--bdr);border-radius:6px;margin-bottom:10px}
.sk-line.w60{width:60%}.sk-line.w80{width:80%}.sk-line.w45{width:45%;height:18px;margin-bottom:16px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* Analysis */
.date-nav{display:flex;align-items:center;gap:8px;padding:12px 0;margin-bottom:16px;border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:10;background:var(--bg)}
.date-nav-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--rs);background:var(--card);border:1px solid var(--bdr);cursor:pointer;font-size:14px;color:var(--text2);transition:all var(--tr);flex-shrink:0}
.date-nav-btn:hover{border-color:var(--accent);color:var(--accent)}
.date-nav-btn:disabled{opacity:.3;cursor:not-allowed}
.date-nav-current{font-size:15px;font-weight:700;color:var(--text);flex:1;text-align:center}
.date-nav-label{font-size:11px;color:var(--text3);white-space:nowrap}
.a-card{content-visibility:auto;contain-intrinsic-size:auto 400px}
.a-head{display:flex;align-items:center;gap:8px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--bdr)}
.a-icon{font-size:18px}.a-title{font-size:15px;font-weight:700}
.a-meta{margin-left:auto;font-size:11px;color:var(--text3);background:var(--bg);padding:2px 8px;border-radius:var(--rs)}

.a-body{font-size:14px;line-height:1.85;color:var(--text2)}
.a-body p{margin-bottom:12px}
.a-body h3{font-size:15px;font-weight:700;color:var(--text);margin:24px 0 12px;padding-top:16px;border-top:1px solid var(--bdr)}
.a-body h3:first-child{border-top:none;padding-top:0;margin-top:0}
.a-body h4{font-size:14px;font-weight:600;color:var(--text);margin:14px 0 8px}
.a-body strong{color:var(--text);font-weight:600}
.a-body ul{list-style:none;padding:0;margin:8px 0}
.a-body li{padding:4px 0 4px 16px;position:relative}
.a-body li::before{content:"›";position:absolute;left:0;color:var(--accent);font-weight:700}
.a-body blockquote{margin:12px 0;padding:8px 12px;border-left:3px solid var(--bdr);color:var(--text3);font-style:italic}
.a-body pre{margin:12px 0;padding:12px;background:var(--bg);border-radius:var(--rs);overflow-x:auto;font-size:13px;line-height:1.5}
.a-body code{font-size:13px;background:var(--bg);padding:1px 4px;border-radius:3px}
.a-body pre code{padding:0;background:none}
.a-body table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.a-body th,.a-body td{padding:6px 10px;border:1px solid var(--bdr);text-align:left}
.a-body th{background:var(--bg);font-weight:600}
.a-body a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.a-history{margin-top:20px;padding-top:16px;border-top:1px solid var(--bdr)}
.a-history-title{font-size:13px;font-weight:700;color:var(--text3);margin-bottom:10px;letter-spacing:.3px}
.a-history-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;max-height:120px;overflow:hidden;transition:max-height .3s ease}
.a-history-item{display:flex;align-items:center;justify-content:center;padding:6px 4px;background:var(--bg);border:1px solid var(--bdr);border-radius:var(--rs);font-size:12px;color:var(--text2);cursor:pointer;transition:all var(--tr);text-decoration:none;white-space:nowrap}
.a-history-item:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-l)}
.a-history-list.expanded{max-height:none}
.a-history-toggle{display:block;margin-top:8px;padding:4px 0;background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;font-family:inherit}
.a-history-toggle:hover{text-decoration:underline}

/* Structured badges */
.a-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--bdr)}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:600;line-height:1}
.badge-up{background:rgba(22,163,74,.1);color:#16a34a}
.badge-down{background:rgba(220,38,38,.1);color:#dc2626}
.badge-flat{background:rgba(37,99,235,.1);color:#2563eb}
.badge-mix{background:rgba(217,119,6,.1);color:#d97706}
.badge-risk-h{background:rgba(220,38,38,.1);color:#dc2626}
.badge-risk-m{background:rgba(107,114,128,.1);color:#6b7280}
.badge-risk-l{background:rgba(22,163,74,.1);color:#16a34a}
.tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:100px;font-size:10px;font-weight:500;background:var(--accent-l);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 20%,transparent)}

.outlook{font-size:12.5px;color:var(--text2);line-height:1.5;padding:8px 12px;background:var(--bg);border-radius:var(--rs);margin-bottom:14px}
.outlook::before{content:"🔮 "}

/* News list */
.news-item{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px solid var(--bdr);content-visibility:auto;contain-intrinsic-size:auto 36px}
.news-item:last-child{border-bottom:none}
.news-title{font-size:13.5px;color:var(--text2);line-height:1.5;flex:1;min-width:0}
.news-title a{color:inherit}.news-title a:hover{color:var(--accent)}
.news-src{font-size:11px;color:var(--text3);white-space:nowrap;flex-shrink:0}
.news-head{display:flex;align-items:center;gap:8px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--bdr)}
.news-head-icon{font-size:18px}.news-head-title{font-size:15px;font-weight:700}
.news-head-count{margin-left:auto;font-size:11px;color:var(--text3);background:var(--bg);padding:2px 8px;border-radius:var(--rs)}
.load-more{display:block;width:100%;padding:10px;margin-top:12px;background:var(--accent-l);color:var(--accent);border:none;border-radius:var(--rs);font-size:13px;font-weight:600;cursor:pointer;transition:all var(--tr);font-family:inherit}
.load-more:hover{background:var(--accent);color:#fff}
.load-more:disabled{opacity:.4;cursor:not-allowed}

/* Responsive */
@media(max-width:860px){
  .layout{
    display:flex;flex-direction:column;height:100vh;
    grid-template-columns:unset;grid-template-rows:unset;
  }
  .sidebar{
    border-left:none;border-bottom:1px solid var(--bdr);
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    display:flex;flex-direction:row;align-items:center;
    overflow:visible;
    background:var(--card);
    padding:0;gap:0;
    flex-shrink:0;
  }
  .main{
    overflow-y:auto;padding:12px 10px 24px;
    contain:layout style;
  }
  .side-section{
    padding:8px 10px;border-bottom:none;
    display:flex;align-items:center;gap:6px;
    white-space:nowrap;flex-shrink:0;
    border-right:1px solid var(--bdr);
  }
  .side-label{display:none}
  /* 隐藏"频道"标签所在的空 section */
  .side-section:has(.side-label){display:none}

  .cat-list{
    display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    padding:6px 8px;flex:1;min-width:0;
    scrollbar-width:none;
  }
  .cat-list::-webkit-scrollbar{display:none}
  .cat-item{
    padding:5px 10px;cursor:pointer;
    font-size:12px;white-space:nowrap;flex-shrink:0;
    border-radius:var(--rs);gap:4px;
    color:var(--text2);
  }
  .cat-item:hover{background:var(--accent-l)}
  .cat-item.active{background:var(--accent-l);color:var(--accent);font-weight:700}
  .cat-count{display:none}
  .main{padding:12px 10px 24px}
}
@media(prefers-reduced-motion:reduce){.sk{animation:none}.cat-item,.load-more{transition:none}}
</style>
</head>
<body>
<div class="layout">
  <div class="main" id="main">
    <div class="date-nav">
      <button class="date-nav-btn" id="prevDate" title="前一天">‹</button>
      <div class="date-nav-current" id="currentDateDisplay">—</div>
      <button class="date-nav-btn" id="nextDate" title="后一天">›</button>
      <span class="date-nav-label" id="dateCount"></span>
    </div>
    <div class="sk-card sk"><div class="sk-line w45"></div><div class="sk-line"></div><div class="sk-line w80"></div></div>
  </div>
  <aside class="sidebar" id="sidebar">
    <div class="side-section" style="padding-bottom:0">
      <div class="side-label">频道</div>
    </div>
    <div class="cat-list" id="catList">
      <div class="cat-item active" data-cat="analysis">
        <span class="cat-icon">🤖</span><span class="cat-name">AI 深度分析</span>
      </div>
    </div>
  </aside>
</div>
<script>
// ===== 统一 LRU 缓存 =====
class LRU{
  constructor(max){this._m=new Map();this._max=max}
  get(k){const m=this._m;if(!m.has(k))return null;const v=m.get(k);m.delete(k);m.set(k,v);return v}
  set(k,v){const m=this._m;if(m.has(k))m.delete(k);else if(m.size>=this._max)m.delete(m.keys().next().value);m.set(k,v)}
  has(k){return this._m.has(k)}
}

// ===== 状态 =====
const S={dates:[],dateIdx:-1,date:"",cat:"analysis",meta:null,newsPage:{},_loading:false};
const $=id=>document.getElementById(id);
const main=$("main"),catList=$("catList");
const _escEl=document.createElement("div");
// esc: 单次正则替换（合并 " 和 HTML 特殊字符）
const _escRe=/[&<>"']/g;
const _escMap={"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
const esc=s=>{if(s==null)return"";_escEl.textContent=s;return _escEl.innerHTML.replace(_escRe,c=>_escMap[c])};

function safeHref(url){try{const u=new URL(url);if(u.protocol==="http:"||u.protocol==="https:")return url}catch{return""}return""}
function fetchT(u,ms=10000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(u,{signal:c.signal}).finally(()=>clearTimeout(t))}

// ===== 缓存实例 =====
const rawCatCache=new LRU(8);
const analysisSummaryCache=new LRU(16);
const analysisFullCache=new LRU(8);
const renderedAnalysisCache=new LRU(10);

// ===== Meta =====
async function loadMeta(){
  if(S.meta)return S.meta;
  try{const r=await fetchT("data/news/meta.json");S.meta=await r.json()}catch{S.meta={categories:[]}}
  return S.meta;
}

// ===== 分类新闻加载（不按日期筛选，按日期倒序返回全部）=====
async function loadNewsCat(file){
  const cached=rawCatCache.get(file);
  if(cached)return cached;
  let data;
  try{const r=await fetchT(`data/news/${encodeURIComponent(file)}.json`);data=await r.json()}catch{data={items:[]}}
  const items=(data.items||[]).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  rawCatCache.set(file,items);
  return items;
}

// ===== 分析数据加载 =====
async function loadAnalysisSummary(){
  const cached=analysisSummaryCache.get(S.date);
  if(cached)return cached;
  try{const r=await fetchT(`data/news/analysis/${S.date}.json`);const d=await r.json();analysisSummaryCache.set(S.date,d);return d}catch{return null}
}
async function loadAnalysisFull(){
  const cached=analysisFullCache.get(S.date);
  if(cached)return cached;
  const summary=analysisSummaryCache.get(S.date);
  if(summary&&summary.analysis){analysisFullCache.set(S.date,summary);return summary}
  try{const r=await fetchT(`data/news/analysis/${S.date}.json`);const d=await r.json();analysisFullCache.set(S.date,d);return d}catch{return null}
}

// ===== 预加载相邻日期 =====
function prefetchAdjacentAnalysis(){
  if(S.dateIdx<0)return;
  const toPrefetch=[];
  if(S.dateIdx>0)toPrefetch.push(S.dates[S.dateIdx-1]);
  if(S.dateIdx<S.dates.length-1)toPrefetch.push(S.dates[S.dateIdx+1]);
  toPrefetch.forEach((d,i)=>{
    if(analysisSummaryCache.has(d))return;
    setTimeout(()=>{fetchT(`data/news/analysis/${d}.json`).then(r=>r.json()).then(j=>analysisSummaryCache.set(d,j)).catch(()=>{})},i*300);
  });
}

// ===== Markdown 解析（单遍扫描） =====
function parseMarkdown(text){
  let body=esc(text);
  // 代码块（先处理，避免内部被其他规则匹配）
  body=body.replace(/```(\w*)\n([\s\S]*?)```/g,(_,lang,code)=>`<pre><code>${code.replace(/\n$/,'')}</code></pre>`);
  // 行内代码
  body=body.replace(/`([^`]+)`/g,'<code>$1</code>');
  // 表格：连续的 | 开头行
  body=body.replace(/((?:^\|.+\|$\n?)+)/gm,(block)=>{
    const rows=block.trim().split('\n').filter(r=>r.trim());
    if(rows.length<2)return block;
    // 跳过分隔行 |---|---|
    const isSep=r=>/^\|[\s:-]+\|$/.test(r.trim());
    const header=rows[0];
    const bodyRows=rows.slice(1).filter(r=>!isSep(r));
    const parseCells=(row,tag)=>row.split('|').slice(1,-1).map(c=>`<${tag}>${c.trim()}</${tag}>`).join('');
    const thead=`<thead><tr>${parseCells(header,'th')}</tr></thead>`;
    const tbody=bodyRows.length?`<tbody>${bodyRows.map(r=>`<tr>${parseCells(r,'td')}</tr>`).join('')}</tbody>`:'';
    return`<table>${thead}${tbody}</table>`;
  });
  // 引用块
  body=body.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
  // 合并连续 blockquote
  body=body.replace(/(<\/blockquote>\n*<blockquote>)+/g,'<br>');
  // 标题
  body=body.replace(/^### (.+)$/gm,'<h4>$1</h4>');
  body=body.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  // 列表项（无序 + 有序）
  body=body.replace(/^- (.+)$/gm,'<li>$1</li>');
  body=body.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
  // 行内：加粗、斜体、链接
  body=body.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  body=body.replace(/\*(.+?)\*/g,'<em>$1</em>');
  body=body.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  // 合并连续 <li> 为 <ul>
  body=body.replace(/(<li>.*<\/li>\n?)+/g,m=>`<ul>${m}</ul>`);
  // 水平线
  body=body.replace(/^---+$/gm,'<hr>');
  // 段落分割
  body=body.replace(/\n\n/g,'</p><p>');
  body=`<p>${body}</p>`;
  // 清理：空段落、包裹块级元素的 <p>
  body=body.replace(/<p>\s*<\/p>/g,'');
  body=body.replace(/<p>\s*(<h[34]>|<table|<blockquote|<pre|<ul|<hr)/g,'$1');
  body=body.replace(/(<\/h[34]>|<\/table>|<\/blockquote>|<\/pre>|<\/ul>|<hr>)\s*<\/p>/g,'$1');
  return body;
}

// ===== 渲染结构化标签 =====
function sortByWeight(items,scoreMap){
  return[...items].sort((a,b)=>(scoreMap.get(b)||0)-(scoreMap.get(a)||0));
}
function renderStructuredTags(data){
  const per=data.perspective?` · ${data.perspective}`:"";
  let tags="";const s=data.structured;
  if(s){
    const sm=s.sentiment||"中性",rk=s.riskLevel||"中";
    const smC={看涨:"badge-up",看跌:"badge-down",分化:"badge-mix"}[sm]||"badge-flat";
    const rkC={高:"badge-risk-h",低:"badge-risk-l"}[rk]||"badge-risk-m";
    const smI={看涨:"📈",看跌:"📉",分化:"🔀"}[sm]||"➡️";
    const rkI={高:"🔴",低:"🟢"}[rk]||"🟡";
    const b=`<span class="badge ${smC}">${smI} ${sm}</span><span class="badge ${rkC}">${rkI} 风险${rk}</span>`;
    // 用 hotKeywords 分数作为权重排序主题/行业
    const kwMap=new Map((data.hotKeywords||[]).map(h=>[h.keyword,h.score]));
    const themes=sortByWeight(s.keyThemes||[],kwMap);
    const sectors=sortByWeight(s.sectors||[],kwMap);
    const t=themes.map(x=>`<span class="tag">${esc(x)}</span>`).join("");
    const sec=sectors.map(x=>`<span class="tag">🏭 ${esc(x)}</span>`).join("");
    const o=s.outlook?`<div class="outlook">${esc(s.outlook)}</div>`:"";
    tags=`<div class="a-tags">${b}${t}${sec}</div>${o}`;
  }
  const hotKw=(data.hotKeywords||[]).slice(0,8);
  const hotHtml=hotKw.length>0?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--bdr)">${hotKw.map(hk=>`<span class="tag" style="background:rgba(239,68,68,.08);color:#ef4444;border-color:rgba(239,68,68,.2)">🔥 ${esc(hk.keyword)} <span style="opacity:.6;margin-left:2px">${hk.score}</span></span>`).join("")}</div>`:"";
  return{tags,hotHtml,per};
}
function analysisHistoryHtml(currentDate){
  const dates=S.dates.filter(d=>d!==currentDate).slice(0,30);
  if(!dates.length)return'';
  const items=dates.map(d=>{
    const m=d.slice(5,7).replace(/^0/,'');
    const day=d.slice(8,10).replace(/^0/,'');
    return `<a class="a-history-item" data-date="${d}" title="${d}">${m}月${day}日</a>`;
  }).join('');
  const needToggle=dates.length>7;
  return `<div class="a-history">
    <div class="a-history-title">📚 以往的AI分析</div>
    <div class="a-history-list">${items}</div>
    ${needToggle?'<button class="a-history-toggle" onclick="this.previousElementSibling.classList.toggle(\'expanded\');this.textContent=this.previousElementSibling.classList.contains(\'expanded\')?\'收起 ▲\':\'展开全部 ▼\'">展开全部 ▼</button>':''}
  </div>`;
}
function renderAnalysis(data){
  if(!data||!data.analysis)return'<div class="empty"><div class="empty-icon">📭</div><p>暂无分析数据</p></div>';
  const date=data.date||(data.generatedAt?new Date(data.generatedAt).toLocaleDateString("sv-SE",{timeZone:"Asia/Shanghai"}):"");
  const{tags,hotHtml,per}=renderStructuredTags(data);
  const body=parseMarkdown(data.analysis);
  return`<div class="card a-card">
    <div class="a-head"><span class="a-icon">🤖</span><span class="a-title">AI 深度分析</span><span class="a-meta">${date} · ${data.newsCount} 条新闻${per}</span></div>
    ${tags}${hotHtml}<div class="a-body">${body}</div>${analysisHistoryHtml(date)}</div>`;
}

// ===== 新闻列表渲染 =====
function renderNewsItem(it){
  const href=it.link?safeHref(it.link):"";
  const t=href?`<a href="${esc(href)}" target="_blank" rel="noopener">${esc(it.title)}</a>`:esc(it.title);
  const s=it.source?`<span class="news-src">${esc(it.source)}</span>`:"";
  return`<div class="news-item"><span class="news-title">${t}</span>${s}</div>`;
}

// pageSize: 固定 40 条/页
function getPageSize(){return 40}

function renderNewsHead(catIcon,catTitle,count){
  return`<div class="news-head"><span class="news-head-icon">${catIcon}</span><span class="news-head-title">${esc(catTitle)}</span><span class="news-head-count">${count} 条</span></div>`;
}
function renderNews(items,catTitle,catIcon,appendMode){
  if(!items||items.length===0)return`<div class="news-head"><span class="news-head-icon">${catIcon}</span><span class="news-head-title">${esc(catTitle)}</span></div><div class="empty"><div class="empty-icon">📭</div><p>暂无新闻</p></div>`;
  const PAGE=getPageSize();
  const page=S.newsPage[catTitle]||1;
  const show=items.slice(0,page*PAGE);
  const hasMore=items.length>show.length;
  if(appendMode){
    const prevCount=(page-1)*PAGE;
    const newItems=show.slice(prevCount);
    const newHtml=newItems.map(renderNewsItem).join("");
    const moreHtml=hasMore?`<button class="load-more" data-cat="${esc(catTitle)}">加载更多 (${items.length-show.length} 条)</button>`:"";
    return{newHtml,moreHtml,hasMore,total:items.length,shown:show.length};
  }
  const list=show.map(renderNewsItem).join("");
  const more=hasMore?`<button class="load-more" data-cat="${esc(catTitle)}">加载更多 (${items.length-show.length} 条)</button>`:"";
  return renderNewsHead(catIcon,catTitle,items.length)+`<div id="newsList">${list}</div>${more}`;
}

// ===== 侧边栏构建 =====
function buildSidebarFromMeta(meta){
  const frag=document.createDocumentFragment();
  const addItem=(cat,icon,name,count)=>{
    const el=document.createElement("div");
    el.className="cat-item"+(cat==="analysis"?" active":"");
    el.dataset.cat=cat;
    el.innerHTML=`<span class="cat-icon">${icon}</span><span class="cat-name">${esc(name)}</span>${count!=null?`<span class="cat-count">${count}</span>`:""}`;
    frag.appendChild(el);
  };
  addItem("analysis","🤖","AI 深度分析");
  for(const c of meta.categories)addItem(c.file,c.icon,c.title,c.count);
  catList.innerHTML="";
  catList.appendChild(frag);
}

// ===== 日期导航（O(1) 查找） =====
function dateIdx(d){return S.dates.indexOf(d)} // fallback
function setDate(d){
  const idx=S.dates.indexOf(d);
  if(idx<0)return;
  S.date=d;S.dateIdx=idx;
  updateDateNav();
  main.scrollTop=0;
  // debounce history.replaceState
  if(S._histTimer)cancelAnimationFrame(S._histTimer);
  S._histTimer=requestAnimationFrame(()=>history.replaceState(null,"",`#${d}`));
  loadView();
}

// ===== 加载视图 =====
async function loadView(){
  if(S._loading)return;S._loading=true;
  main.scrollTop=0;
  try{
    if(S.cat==="analysis"){
      const cachedHtml=renderedAnalysisCache.get(S.date);
      if(cachedHtml){main.innerHTML=cachedHtml;prefetchAdjacentAnalysis();return}
      main.innerHTML='<div class="sk-card sk"><div class="sk-line w45"></div><div class="sk-line"></div><div class="sk-line w80"></div></div>';
      const data=await loadAnalysisSummary();
      if(!data||!data.analysis){const html=renderAnalysis(data);main.innerHTML=html;renderedAnalysisCache.set(S.date,html);return}
      const date=data.date||(data.generatedAt?new Date(data.generatedAt).toLocaleDateString("sv-SE",{timeZone:"Asia/Shanghai"}):"");
      const{tags,hotHtml,per}=renderStructuredTags(data);
      main.innerHTML=`<div class="card a-card">
        <div class="a-head"><span class="a-icon">🤖</span><span class="a-title">AI 深度分析</span><span class="a-meta">${date} · ${data.newsCount} 条新闻${per}</span></div>
        ${tags}${hotHtml}<div class="a-body"><div class="sk"><div class="sk-line"></div><div class="sk-line w80"></div><div class="sk-line w60"></div></div></div>${analysisHistoryHtml(date)}</div>`;
      const full=await loadAnalysisFull();
      const bodyEl=main.querySelector(".a-body");
      if(full&&full.analysis&&bodyEl){bodyEl.innerHTML=parseMarkdown(full.analysis)}
      renderedAnalysisCache.set(S.date,main.innerHTML);
      prefetchAdjacentAnalysis();
    }else{
      main.innerHTML='<div class="sk-card sk"><div class="sk-line w45"></div><div class="sk-line"></div><div class="sk-line w80"></div></div>';
      const meta=await loadMeta();
      const cat=meta.categories.find(c=>c.file===S.cat);
      if(!cat){main.innerHTML='<div class="empty">分类未找到</div>';return}
      const items=await loadNewsCat(S.cat);
      main.innerHTML=renderNews(items,cat.title,cat.icon);
    }
  }finally{S._loading=false}
}

// ===== 事件绑定 =====
function setupEvents(){
  main.addEventListener("click",e=>{
    const item=e.target.closest(".a-history-item");
    if(!item)return;
    e.preventDefault();
    const d=item.dataset.date;
    if(d&&S.dates.indexOf(d)>=0)setDate(d);
  });
  catList.onclick=e=>{
    const item=e.target.closest(".cat-item");
    if(!item)return;
    const cat=item.dataset.cat;
    if(cat===S.cat)return;
    S.cat=cat;
    catList.querySelectorAll(".cat-item").forEach(el=>el.classList.toggle("active",el.dataset.cat===cat));
    S.newsPage={};
    loadView();
  };
  catList.addEventListener("mouseenter",e=>{
    const item=e.target.closest(".cat-item");
    if(!item||item.dataset.cat==="analysis")return;
    const file=item.dataset.cat;
    if(!rawCatCache.has(file)){
      fetchT(`data/news/${encodeURIComponent(file)}.json`).then(r=>r.json()).then(d=>{
        const items=(d.items||[]).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
        rawCatCache.set(file,items);
      }).catch(()=>{});
    }
  },true);
  main.onclick=async e=>{
    const btn=e.target.closest(".load-more");
    if(!btn)return;
    const cat=btn.dataset.cat;
    S.newsPage[cat]=(S.newsPage[cat]||1)+1;
    const meta=S.meta;
    const catObj=meta.categories.find(c=>c.title===cat);
    if(!catObj)return;
    btn.disabled=true;btn.textContent="加载中...";
    const items=await loadNewsCat(catObj.file);
    const result=renderNews(items,cat,catObj.icon,true);
    const listEl=main.querySelector("#newsList");
    if(listEl){const frag=document.createElement("div");frag.innerHTML=result.newHtml;while(frag.firstChild)listEl.appendChild(frag.firstChild)}
    btn.remove();
    if(result.hasMore){
      const newBtn=document.createElement("button");
      newBtn.className="load-more";newBtn.dataset.cat=cat;
      newBtn.textContent=`加载更多 (${result.total-result.shown} 条)`;
      (main.querySelector(".card")||main).appendChild(newBtn);
    }
  };
  window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==S.date&&S.dates.indexOf(h)>=0)setDate(h)});
  document.getElementById('prevDate')?.addEventListener('click',()=>{if(S.dateIdx>0)setDate(S.dates[S.dateIdx-1])});
  document.getElementById('nextDate')?.addEventListener('click',()=>{if(S.dateIdx<S.dates.length-1)setDate(S.dates[S.dateIdx+1])});
}

// ===== 初始化 =====
function updateDateNav(){
  const d=S.date;
  const el=document.getElementById('currentDateDisplay');
  const prev=document.getElementById('prevDate');
  const next=document.getElementById('nextDate');
  const cnt=document.getElementById('dateCount');
  if(el){const[y,m,day]=d.split('-');el.textContent=y+'年'+parseInt(m)+'月'+parseInt(day)+'日'}
  if(prev)prev.disabled=S.dateIdx<=0;
  if(next)next.disabled=S.dateIdx>=S.dates.length-1;
  if(cnt)cnt.textContent=S.dates.length+' 个分析';
}
async function init(){
  setupEvents();
  const[dates,meta]=await Promise.all([
    fetchT("data/news/analysis/index.json").then(r=>r.json()).catch(()=>[]),
    loadMeta()
  ]);
  S.dates=dates;
  const h=location.hash.slice(1);
  const startIdx=h?dates.indexOf(h):-1;
  S.date=startIdx>=0?h:(dates[0]||"");
  S.dateIdx=startIdx>=0?startIdx:0;
  buildSidebarFromMeta(meta);
  updateDateNav();
  setDate(S.date);
  // 空闲预取
  const prefetchCats=()=>{
    const top=meta.categories.slice(0,2);
    top.forEach((c,i)=>{
      if(rawCatCache.has(c.file))return;
      setTimeout(()=>{fetchT(`data/news/${encodeURIComponent(c.file)}.json`).then(r=>r.json()).then(d=>{
        const items=(d.items||[]).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
        rawCatCache.set(c.file,items);
      }).catch(()=>{})},i*200);
    });
  };
  if("requestIdleCallback"in window)requestIdleCallback(prefetchCats,{timeout:3000});else setTimeout(prefetchCats,1000);
}
document.addEventListener("DOMContentLoaded",init);
</script>
