<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>AI 深度分析 - holipay</title>
        <meta
            name="description"
            content="holipay AI 每日深度分析全球金融、科技、社科资讯"
        />
        <link rel="stylesheet" href="common.css" />

        <style>
            .layout {
                display: grid;
                grid-template-columns: 1fr 260px;
                grid-template-rows: auto 1fr;
                height: 100vh;
            }
            .main {
                overflow-y: auto;
                padding: 24px 28px 40px;
                min-width: 0;
                contain: layout style;
                scrollbar-gutter: stable;
            }
            .sidebar {
                border-left: 1px solid var(--bdr);
                background: var(--card);
                overflow-y: auto;
                padding: 0;
            }
            .side-section {
                padding: 14px 16px;
                border-bottom: 1px solid var(--bdr);
            }
            .side-label {
                font-size: 11px;
                font-weight: 700;
                color: var(--text3);
                text-transform: uppercase;
                letter-spacing: 0.5px;
                margin-bottom: 10px;
            }
            .date-list {
                padding: 8px 0;
            }
            .date-item {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 9px 16px;
                cursor: pointer;
                transition: background var(--tr);
                user-select: none;
                font-size: 13px;
                color: var(--text);
            }
            .date-item:hover {
                background: var(--accent-l);
            }
            .date-item.active {
                background: var(--accent-l);
                color: var(--accent);
                font-weight: 700;
            }
            .date-icon {
                font-size: 15px;
                flex-shrink: 0;
                width: 20px;
                text-align: center;
            }
            .date-name {
                flex: 1;
                min-width: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            @media (max-width: 860px) {
                .layout {
                    display: flex;
                    flex-direction: column;
                    height: 100vh;
                    grid-template-columns: unset;
                    grid-template-rows: unset;
                }
                .sidebar {
                    border-left: none;
                    border-bottom: 1px solid var(--bdr);
                    display: flex;
                    flex-direction: row;
                    align-items: center;
                    overflow: visible;
                    padding: 0;
                    gap: 0;
                    flex-shrink: 0;
                    background: var(--card);
                    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
                }
                .side-section {
                    padding: 8px 10px;
                    border-bottom: none;
                    display: flex;
                    align-items: center;
                    gap: 6px;
                    white-space: nowrap;
                    flex-shrink: 0;
                    border-right: 1px solid var(--bdr);
                }
                .side-label {
                    display: none;
                }
                .date-list {
                    display: flex;
                    gap: 4px;
                    overflow-x: auto;
                    -webkit-overflow-scrolling: touch;
                    padding: 6px 8px;
                    flex: 1;
                    min-width: 0;
                    scrollbar-width: none;
                }
                .date-list::-webkit-scrollbar {
                    display: none;
                }
                .date-item {
                    padding: 5px 10px;
                    font-size: 12px;
                    white-space: nowrap;
                    flex-shrink: 0;
                    border-radius: var(--rs);
                    gap: 4px;
                    color: var(--text2);
                }
                .date-icon {
                    display: none;
                }
                .main {
                    padding: 12px 10px 24px;
                }
                .nav-bar {
                    padding: 8px 10px;
                    gap: 4px;
                }
                .nav-title {
                    font-size: 13px;
                }
                .nav-link {
                    font-size: 11px;
                    padding: 4px 8px;
                }
            }
        </style>
    </head>
    <body>
        <div class="layout">
            <nav class="nav-bar">
                <span class="nav-title">🤖 holipay</span>
                <a class="nav-link active" href="index.html"
                    ><span class="nav-link-icon">🤖</span>AI 分析</a
                >
                <a class="nav-link" href="articles.html"
                    ><span class="nav-link-icon">⭐</span>精选文章</a
                >
                <a class="nav-link" href="news.html"
                    ><span class="nav-link-icon">📰</span>新闻列表</a
                >
            </nav>
            <div class="main" id="main">
                <div class="sk-card sk">
                    <div class="sk-line w45"></div>
                    <div class="sk-line"></div>
                    <div class="sk-line w80"></div>
                </div>
            </div>
            <aside class="sidebar" id="sidebar">
                <div class="side-section">
                    <div class="side-label">📅 日期</div>
                </div>
                <div class="date-list" id="dateList"></div>
            </aside>
        </div>
        <script src="js/common.js"></script>
        <script>
            const main = $("main"),
                dateList = $("dateList");
            let currentDate = "";
            let loading = false;

            async function loadView(date) {
                if (loading) return;
                loading = true;
                main.innerHTML =
                    '<div class="sk-card sk"><div class="sk-line w45"></div><div class="sk-line"></div><div class="sk-line w80"></div></div>';
                const data = await loadAnalysisForDate(date);
                main.innerHTML = renderAnalysis(data);
                loading = false;
            }

            dateList.onclick = (e) => {
                const item = e.target.closest(".date-item");
                if (!item || item.dataset.date === currentDate) return;
                currentDate = item.dataset.date;
                dateList
                    .querySelectorAll(".date-item")
                    .forEach((el) =>
                        el.classList.toggle(
                            "active",
                            el.dataset.date === currentDate,
                        ),
                    );
                loadView(currentDate);
            };

            // Init
            async function init() {
                // 并行加载：日期索引 + 最新分析（不需要等索引才知道加载哪个）
                const [dates] = await Promise.all([
                    loadAllDates(),
                    // 预热分析缓存（如果 service worker 已缓存则秒回）
                    loadAnalysisForDate(new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Shanghai" })).catch(() => null)
                ]);
                if (!dates.length) {
                    main.innerHTML =
                        '<div class="empty"><div class="empty-icon">📭</div><p>暂无分析数据</p></div>';
                    return;
                }
                // Build sidebar
                const frag = document.createDocumentFragment();
                for (const d of dates) {
                    const el = document.createElement("div");
                    el.className = "date-item";
                    el.dataset.date = d;
                    el.innerHTML = `<span class="date-icon">📅</span><span class="date-name">${esc(d)}</span>`;
                    frag.appendChild(el);
                }
                dateList.appendChild(frag);
                currentDate = dates[0];
                dateList.querySelector(".date-item")?.classList.add("active");
                loadView(currentDate);
            }

            init();
        </script>
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebSite",
                "name": "holipay",
                "url": "https://holipay.github.io/",
                "description": "holipay AI 每日深度分析全球金融、科技、社科资讯",
                "inLanguage": "zh-CN",
                "potentialAction": {
                    "@type": "SearchAction",
                    "target": "https://holipay.github.io/search?q={search_term_string}",
                    "query-input": "required name=search_term_string"
                }
            }
        </script>
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "CollectionPage",
                "name": "AI 深度分析 - holipay",
                "url": "https://holipay.github.io/",
                "description": "holipay AI 每日深度分析全球金融、科技、社科资讯",
                "inLanguage": "zh-CN",
                "isPartOf": {
                    "@type": "WebSite",
                    "name": "holipay",
                    "url": "https://holipay.github.io/"
                },
                "about": [
                    { "@type": "Thing", "name": "全球金融分析" },
                    { "@type": "Thing", "name": "科技资讯" },
                    { "@type": "Thing", "name": "社科资讯" }
                ]
            }
        </script>
    </body>
</html>
