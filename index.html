<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>AI 深度分析 - nase.me</title>
        <meta
            name="description"
            content="nase.me AI 每日深度分析全球金融、科技、社科资讯"
        />
        <link rel="stylesheet" href="common.css" />
        <style>
            .layout {
                max-width: 960px;
                margin: 0 auto;
                height: 100vh;
                display: flex;
                flex-direction: column;
            }
            .main {
                overflow-y: auto;
                padding: 24px 28px 40px;
                flex: 1;
                contain: layout style;
            }
            @media (max-width: 860px) {
                .nav-bar {
                    padding: 8px 10px;
                    gap: 4px;
                }
                .nav-title {
                    font-size: 13px;
                }
                .nav-link {
                    font-size: 11px;
                    padding: 4px 8px;
                }
                .main {
                    padding: 16px 14px 32px;
                }
            }
        </style>
    </head>
    <body>
        <div class="layout">
            <nav class="nav-bar">
                <span class="nav-title">🤖 nase.me</span>
                <a class="nav-link active" href="index.html"
                    ><span class="nav-link-icon">🤖</span>AI 分析</a
                >
                <a class="nav-link" href="news.html"
                    ><span class="nav-link-icon">📰</span>新闻列表</a
                >
                <a class="nav-link" href="articles.html"
                    ><span class="nav-link-icon">⭐</span>精选文章</a
                >
            </nav>
            <div class="main" id="main">
                <div class="sk-card sk">
                    <div class="sk-line w45"></div>
                    <div class="sk-line"></div>
                    <div class="sk-line w80"></div>
                </div>
            </div>
        </div>
        <button id="toTop" title="回到顶部">↑</button>
        <script src="js/common.js"></script>
        <script>
            const main = $("main");
            let analysisPage = 0;
            let loading = false;

            async function loadMore() {
                if (loading) return;
                loading = true;
                const dates = await loadAllDates();
                if (!dates.length) {
                    main.innerHTML =
                        '<div class="empty"><div class="empty-icon">📭</div><p>暂无分析数据</p></div>';
                    loading = false;
                    return;
                }

                const start = analysisPage;
                const end = Math.min(start + 1, dates.length);
                let html = "";
                for (let i = start; i < end; i++) {
                    const data = await loadAnalysisForDate(dates[i]);
                    if (data) html += renderAnalysis(data);
                }

                if (start === 0) {
                    // Initial render
                    if (!html)
                        html =
                            '<div class="empty"><div class="empty-icon">📭</div><p>暂无分析数据</p></div>';
                    if (end < dates.length)
                        html += `<button class="load-more" id="loadMoreBtn">加载更多分析 (${dates.length - end} 期)</button>`;
                    main.innerHTML = html;
                } else {
                    // Append
                    const btn = main.querySelector("#loadMoreBtn");
                    if (btn) btn.remove();
                    if (html) {
                        const frag = document.createElement("div");
                        frag.innerHTML = html;
                        while (frag.firstChild)
                            main.appendChild(frag.firstChild);
                    }
                    if (end < dates.length) {
                        const newBtn = document.createElement("button");
                        newBtn.className = "load-more";
                        newBtn.id = "loadMoreBtn";
                        newBtn.textContent = `加载更多分析 (${dates.length - end} 期)`;
                        main.appendChild(newBtn);
                    }
                }
                analysisPage = end;
                loading = false;
            }

            main.onclick = async (e) => {
                const btn = e.target.closest(".load-more");
                if (!btn) return;
                btn.disabled = true;
                btn.textContent = "加载中...";
                await loadMore();
            };

            // Back to top
            const toTop = document.getElementById("toTop");
            if (toTop) {
                main.addEventListener(
                    "scroll",
                    () => {
                        toTop.classList.toggle("visible", main.scrollTop > 300);
                    },
                    { passive: true },
                );
                toTop.addEventListener("click", () =>
                    main.scrollTo({ top: 0, behavior: "smooth" }),
                );
            }

            // Init
            loadMore();
            if ("serviceWorker" in navigator)
                navigator.serviceWorker.register("js/sw.js").catch(() => {});
        </script>
    </body>
</html>
