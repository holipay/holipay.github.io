<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>新闻列表 - nase.me</title>
        <meta
            name="description"
            content="nase.me 全球金融、科技、社科新闻资讯列表"
        />
        <link rel="stylesheet" href="common.css" />
        <link rel="preload" href="js/common.js" as="script" />
        <style>
            .layout {
                display: grid;
                grid-template-columns: 1fr 260px;
                grid-template-rows: auto 1fr;
                height: 100vh;
            }
            .main {
                overflow-y: auto;
                padding: 24px 28px 40px;
                min-width: 0;
                contain: layout style;
            }
            .sidebar {
                border-left: 1px solid var(--bdr);
                background: var(--card);
                overflow-y: auto;
                padding: 0;
            }
            .side-section {
                padding: 14px 16px;
                border-bottom: 1px solid var(--bdr);
            }
            .side-label {
                font-size: 11px;
                font-weight: 700;
                color: var(--text3);
                text-transform: uppercase;
                letter-spacing: 0.5px;
                margin-bottom: 10px;
            }
            .cat-list {
                padding: 8px 0;
            }
            .cat-item {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 9px 16px;
                cursor: pointer;
                transition: background var(--tr);
                user-select: none;
                font-size: 13px;
                color: var(--text);
            }
            .cat-item:hover {
                background: var(--accent-l);
            }
            .cat-item.active {
                background: var(--accent-l);
                color: var(--accent);
                font-weight: 700;
            }
            .cat-icon {
                font-size: 15px;
                flex-shrink: 0;
                width: 20px;
                text-align: center;
            }
            .cat-name {
                flex: 1;
                min-width: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .cat-count {
                font-size: 10px;
                color: var(--text3);
                background: var(--bg);
                padding: 1px 6px;
                border-radius: 100px;
                flex-shrink: 0;
            }
            .news-cat {
                display: inline-block;
                font-size: 10px;
                color: var(--accent);
                background: var(--accent-l);
                padding: 1px 6px;
                border-radius: 100px;
                margin-right: 6px;
                flex-shrink: 0;
                vertical-align: middle;
            }
            @media (max-width: 860px) {
                .layout {
                    display: flex;
                    flex-direction: column;
                    height: 100vh;
                    grid-template-columns: unset;
                    grid-template-rows: unset;
                }
                .sidebar {
                    border-left: none;
                    border-bottom: 1px solid var(--bdr);
                    display: flex;
                    flex-direction: row;
                    align-items: center;
                    overflow: visible;
                    padding: 0;
                    gap: 0;
                    flex-shrink: 0;
                    background: var(--card);
                    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
                }
                .side-section {
                    padding: 8px 10px;
                    border-bottom: none;
                    display: flex;
                    align-items: center;
                    gap: 6px;
                    white-space: nowrap;
                    flex-shrink: 0;
                    border-right: 1px solid var(--bdr);
                }
                .side-label {
                    display: none;
                }
                .cat-list {
                    display: flex;
                    gap: 4px;
                    overflow-x: auto;
                    -webkit-overflow-scrolling: touch;
                    padding: 6px 8px;
                    flex: 1;
                    min-width: 0;
                    scrollbar-width: none;
                }
                .cat-list::-webkit-scrollbar {
                    display: none;
                }
                .cat-item {
                    padding: 5px 10px;
                    font-size: 12px;
                    white-space: nowrap;
                    flex-shrink: 0;
                    border-radius: var(--rs);
                    gap: 4px;
                    color: var(--text2);
                }
                .cat-count {
                    display: none;
                }
                .main {
                    padding: 12px 10px 24px;
                }
                .nav-bar {
                    padding: 8px 10px;
                    gap: 4px;
                }
                .nav-title {
                    font-size: 13px;
                }
                .nav-link {
                    font-size: 11px;
                    padding: 4px 8px;
                }
            }
        </style>
    </head>
    <body>
        <div class="layout">
            <nav class="nav-bar">
                <span class="nav-title">📰 nase.me</span>
                <a class="nav-link" href="index.html"
                    ><span class="nav-link-icon">🤖</span>AI 分析</a
                >
                <a class="nav-link" href="articles.html"
                    ><span class="nav-link-icon">⭐</span>精选文章</a
                >
                <a class="nav-link active" href="news.html"
                    ><span class="nav-link-icon">📰</span>新闻列表</a
                >
            </nav>
            <div class="main" id="main">
                <div class="sk-card sk">
                    <div class="sk-line w45"></div>
                    <div class="sk-line"></div>
                    <div class="sk-line w80"></div>
                </div>
            </div>
            <aside class="sidebar" id="sidebar">
                <div class="side-section" style="padding-bottom: 0">
                    <div class="side-label">频道</div>
                </div>
                <div class="cat-list" id="catList"></div>
            </aside>
        </div>
        <script src="js/common.js"></script>
        <script>
            // 内联 meta 数据（消除首次加载的 meta.json 请求）
            const __INLINE_META = {"topic":"news","name":"全球资讯","icon":"📰","updatedAt":"2026-05-28T05:33:22.806Z","categories":[{"icon":"📈","title":"股市与市场","file":"股市与市场","count":200,"archiveCount":0},{"icon":"📰","title":"其他资讯","file":"其他资讯","count":157,"archiveCount":0},{"icon":"🖥️","title":"科技与企业","file":"科技与企业","count":200,"archiveCount":0},{"icon":"🌍","title":"国际财经","file":"国际财经","count":108,"archiveCount":18},{"icon":"🛢️","title":"大宗商品与能源","file":"大宗商品与能源","count":174,"archiveCount":0},{"icon":"🏦","title":"央行与利率","file":"央行与利率","count":116,"archiveCount":0},{"icon":"💰","title":"宏观经济","file":"宏观经济","count":121,"archiveCount":0},{"icon":"🤖","title":"科技与研究","file":"科技与研究","count":30,"archiveCount":5},{"icon":"🏛️","title":"政治与治理","file":"政治与治理","count":146,"archiveCount":0},{"icon":"👥","title":"社会与人口","file":"社会与人口","count":174,"archiveCount":0},{"icon":"⚖️","title":"法律与伦理","file":"法律与伦理","count":11,"archiveCount":2},{"icon":"🏥","title":"健康与公共卫生","file":"健康与公共卫生","count":31,"archiveCount":5},{"icon":"🌍","title":"环境与能源","file":"环境与能源","count":20,"archiveCount":5},{"icon":"📚","title":"教育与媒体","file":"教育与媒体","count":44,"archiveCount":7},{"icon":"🧠","title":"心理学与认知","file":"心理学与认知","count":23,"archiveCount":4}]};

            const main = $("main"),
                catList = $("catList");
            const PAGE_SIZE = 40;
            const S = { cat: "__latest__", newsPage: {}, loading: false };

            // 最新视图的新闻条目渲染（带分类标签）
            function renderLatestItem(it) {
                const href = it.link ? safeHref(it.link) : "";
                const t = href
                    ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                    : esc(it.title);
                const s = it.source ? `<span class="news-src">${esc(it.source)}</span>` : "";
                const d = it.date ? `<span class="news-date">${esc(it.date)}</span>` : "";
                const catBadge = it.category ? `<span class="news-cat">${esc(it.category)}</span>` : "";
                return `<div class="news-item">${catBadge}<span class="news-title">${t}</span>${d}${s}</div>`;
            }

            function renderNews(items, catFile, catIcon, catTitle, appendMode) {
                const isLatest = catFile === "__latest__";
                const itemRenderer = isLatest ? renderLatestItem : renderNewsItem;

                if (!items || items.length === 0)
                    return `<div class="news-head"><span class="news-head-icon">${catIcon}</span><span class="news-head-title">${esc(catTitle)}</span></div><div class="empty"><div class="empty-icon">📭</div><p>暂无新闻</p></div>`;
                if (appendMode) {
                    const page = S.newsPage[catFile] || 1;
                    const show = items.slice(0, page * PAGE_SIZE);
                    const prevCount = (page - 1) * PAGE_SIZE;
                    const newItems = show.slice(prevCount);
                    const hasMore = items.length > show.length;
                    return {
                        newHtml: newItems.map(itemRenderer).join(""),
                        hasMore,
                        total: items.length,
                        shown: show.length,
                    };
                }
                const page = S.newsPage[catFile] || 1;
                const show = items.slice(0, page * PAGE_SIZE);
                const hasMore = items.length > show.length;

                // 分批渲染：先渲染首屏 20 条，剩余用 rAF 空闲渲染
                const FIRST_BATCH = 20;
                const firstBatch = show.slice(0, FIRST_BATCH);
                const restBatch = show.slice(FIRST_BATCH);
                const headHtml = renderNewsHead(catIcon, catTitle, items.length);
                const listHtml = firstBatch.map(itemRenderer).join("");

                if (restBatch.length > 0) {
                    requestAnimationFrame(() => {
                        const listEl = document.getElementById("newsList");
                        if (listEl) {
                            const frag = document.createElement("div");
                            frag.innerHTML = restBatch.map(itemRenderer).join("");
                            while (frag.firstChild) listEl.appendChild(frag.firstChild);
                        }
                    });
                }

                return (
                    headHtml +
                    `<div id="newsList">${listHtml}</div>` +
                    (hasMore
                        ? `<button class="load-more" data-cat="${esc(catFile)}">加载更多 (${items.length - show.length} 条)</button>`
                        : "")
                );
            }

            let _metaCache = __INLINE_META; // 优先使用内联数据
            async function loadMetaOnce() {
                if (_metaCache) return _metaCache;
                _metaCache = await loadMeta();
                return _metaCache;
            }

            // latest.json 缓存
            let _latestCache = null;
            async function loadLatest() {
                if (_latestCache) return _latestCache;
                try {
                    const r = await fetchT("data/news/latest.json");
                    _latestCache = await r.json();
                } catch {
                    _latestCache = { items: [] };
                }
                return _latestCache;
            }

            async function loadView() {
                if (S.loading) return;
                S.loading = true;
                main.innerHTML =
                    '<div class="sk-card sk"><div class="sk-line w45"></div><div class="sk-line"></div><div class="sk-line w80"></div></div>';

                if (S.cat === "__latest__") {
                    // 最新视图：加载 latest.json（更小，更快）
                    const data = await loadLatest();
                    const items = (data.items || []).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
                    main.innerHTML = renderNews(items, "__latest__", "🔥", "最新资讯");
                    S.loading = false;
                    return;
                }

                const meta = await loadMetaOnce();
                const cat = meta.categories.find((c) => c.file === S.cat);
                if (!cat) {
                    main.innerHTML = '<div class="empty">分类未找到</div>';
                    S.loading = false;
                    return;
                }
                const items = await loadNewsCat(S.cat);
                main.innerHTML = renderNews(items, S.cat, cat.icon, cat.title);
                S.loading = false;
            }

            main.onclick = async (e) => {
                const btn = e.target.closest(".load-more");
                if (!btn) return;
                btn.disabled = true;
                btn.textContent = "加载中...";
                const cat = btn.dataset.cat;
                S.newsPage[cat] = (S.newsPage[cat] || 1) + 1;
                const meta = await loadMetaOnce();
                const catObj = meta.categories.find((c) => c.file === cat);
                if (!catObj) return;
                const items = await loadNewsCat(cat);
                const result = renderNews(
                    items,
                    cat,
                    catObj.icon,
                    catObj.title,
                    true,
                );
                const listEl = main.querySelector("#newsList");
                if (listEl) {
                    const frag = document.createElement("div");
                    frag.innerHTML = result.newHtml;
                    while (frag.firstChild) listEl.appendChild(frag.firstChild);
                }
                btn.remove();
                if (result.hasMore) {
                    const newBtn = document.createElement("button");
                    newBtn.className = "load-more";
                    newBtn.dataset.cat = cat;
                    newBtn.textContent = `加载更多 (${result.total - result.shown} 条)`;
                    main.appendChild(newBtn);
                }
            };

            catList.onclick = (e) => {
                const item = e.target.closest(".cat-item");
                if (!item || item.dataset.cat === S.cat) return;
                S.cat = item.dataset.cat;
                S.newsPage = {};
                catList
                    .querySelectorAll(".cat-item")
                    .forEach((el) =>
                        el.classList.toggle("active", el.dataset.cat === S.cat),
                    );
                loadView();
            };

            catList.addEventListener(
                "mouseenter",
                (e) => {
                    const item = e.target.closest(".cat-item");
                    if (!item) return;
                    const file = item.dataset.cat;
                    if (!rawCatCache.has(file)) {
                        fetchT(`data/news/${encodeURIComponent(file)}.json`)
                            .then((r) => r.json())
                            .then((d) => {
                                const items = (d.items || [])
                                    .slice()
                                    .sort((a, b) =>
                                        (b.date || "").localeCompare(
                                            a.date || "",
                                        ),
                                    );
                                rawCatCache.set(file, items);
                            })
                            .catch(() => {});
                    }
                },
                true,
            );

            async function init() {
                const meta = await loadMetaOnce();

                // Build sidebar — "🔥 最新" 放在最前面
                const frag = document.createDocumentFragment();
                const latestEl = document.createElement("div");
                latestEl.className = "cat-item active";
                latestEl.dataset.cat = "__latest__";
                latestEl.innerHTML = `<span class="cat-icon">🔥</span><span class="cat-name">最新资讯</span>`;
                frag.appendChild(latestEl);

                for (const c of meta.categories) {
                    const el = document.createElement("div");
                    el.className = "cat-item";
                    el.dataset.cat = c.file;
                    el.innerHTML = `<span class="cat-icon">${c.icon}</span><span class="cat-name">${esc(c.title)}</span><span class="cat-count">${c.count}</span>`;
                    frag.appendChild(el);
                }
                catList.appendChild(frag);

                // 默认加载最新视图（latest.json，12KB，比任何分类文件都小）
                loadView();

                // 预加载前 3 个分类（后台，并行）
                meta.categories.slice(0, 3).forEach((c, i) => {
                    setTimeout(() => {
                        if (!rawCatCache.has(c.file)) loadNewsCat(c.file);
                    }, i * 100);
                });
            }

            init();
            if ("serviceWorker" in navigator)
                navigator.serviceWorker.register("js/sw.js").catch(() => {});
        </script>
    </body>
</html>
