name: Update News

on:
  schedule:
    # 每天 UTC 0:00（北京时间 8:00）— 全量更新
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "更新模式"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - finance-only
          - analysis-only

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Determine mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "📋 Mode: $MODE"

      - name: Fetch news
        if: steps.mode.outputs.mode != 'analysis-only'
        env:
          TZ: Asia/Shanghai
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node .github/scripts/update-news.js --topic=news

      - name: AI analysis
        env:
          TZ: Asia/Shanghai
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "finance-only" ]; then
            echo "⏭️ finance-only 模式，跳过分析"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node .github/scripts/analyze.js --force
          else
            node .github/scripts/analyze.js
          fi

      - name: Trim old data
        run: node .github/scripts/trim-data.js --max=40

      - name: Update SW cache version
        run: |
          SW_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)
          sed -i "s/const CACHE_NAME = \"nase-[^\"]*\"/const CACHE_NAME = \"nase-${SW_DATE}\"/" js/sw.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news/ \
            ':!data/news/titles-index.json' \
            ':!data/news/analysis.json' \
            ':!data/news/dashboard.json' \
            ':!data/news/events.json' \
            ':!data/news/*_archive.json' \
            .github/scripts/translations-cache.json \
            .github/scripts/source-health.json \
            .github/scripts/source-etag.json \
            .github/scripts/run-metrics.json \
            js/sw.js \
            .github/scripts/trim-data.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📰 资讯更新 + AI分析 $(date +%Y-%m-%d)"
            git push
          fi
