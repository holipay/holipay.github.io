name: Update News

on:
  schedule:
    # 每 2 天 UTC 0:00（北京时间 8:00）
    - cron: "0 0 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Fetch news
        env:
          TZ: Asia/Shanghai
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node .github/scripts/update-news.js --topic=news

      - name: AI analysis
        env:
          TZ: Asia/Shanghai
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node .github/scripts/analyze.js --force
          else
            node .github/scripts/analyze.js
          fi

      - name: Trim old data
        run: node trim-data.js --max=200

      - name: Update SW cache version
        run: |
          SW_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)
          sed -i "s/const CACHE_NAME = \"nase-[^\"]*\"/const CACHE_NAME = \"nase-${SW_DATE}\"/" sw.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news/ .github/scripts/translations-cache.json sw.js trim-data.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📰 资讯更新 + AI分析 $(date +%Y-%m-%d)"
            git push
          fi
