<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>精选文章 - nase.me</title>
        <meta
            name="description"
            content="nase.me 精选金融、科技、社科资讯文章"
        />
        <link rel="stylesheet" href="common.css" />
        <style>
            .layout {
                display: grid;
                grid-template-columns: 1fr 260px;
                grid-template-rows: auto 1fr;
                height: 100vh;
            }
            .main {
                overflow-y: auto;
                padding: 24px 28px 40px;
                min-width: 0;
                contain: layout style;
            }
            .sidebar {
                border-left: 1px solid var(--bdr);
                background: var(--card);
                overflow-y: auto;
                padding: 0;
            }
            .side-section {
                padding: 14px 16px;
                border-bottom: 1px solid var(--bdr);
            }
            .side-label {
                font-size: 11px;
                font-weight: 700;
                color: var(--text3);
                text-transform: uppercase;
                letter-spacing: 0.5px;
                margin-bottom: 10px;
            }
            .date-list {
                padding: 8px 0;
            }
            .date-item {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 9px 16px;
                cursor: pointer;
                transition: background var(--tr);
                user-select: none;
                font-size: 13px;
                color: var(--text);
            }
            .date-item:hover {
                background: var(--accent-l);
            }
            .date-item.active {
                background: var(--accent-l);
                color: var(--accent);
                font-weight: 700;
            }
            .date-icon {
                font-size: 15px;
                flex-shrink: 0;
                width: 20px;
                text-align: center;
            }
            .date-name {
                flex: 1;
                min-width: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .article-card {
                background: var(--card);
                border-radius: var(--r);
                padding: 18px 22px;
                box-shadow: var(--sh);
                border: 1px solid var(--bdr);
                margin-bottom: 16px;
                transition:
                    border-color 0.2s,
                    box-shadow 0.2s;
            }
            .article-card:hover {
                border-color: var(--accent);
                box-shadow: var(--sh-h);
            }
            .article-head {
                display: flex;
                align-items: flex-start;
                gap: 10px;
                margin-bottom: 10px;
            }
            .article-tier {
                flex-shrink: 0;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 28px;
                height: 28px;
                border-radius: 8px;
                font-size: 12px;
                font-weight: 700;
            }
            .tier-1 {
                background: rgba(239, 68, 68, 0.1);
                color: #ef4444;
            }
            .tier-2 {
                background: rgba(245, 158, 11, 0.1);
                color: #f59e0b;
            }
            .tier-3 {
                background: rgba(107, 114, 128, 0.1);
                color: #6b7280;
            }
            .article-title {
                font-size: 15px;
                font-weight: 600;
                color: var(--text);
                line-height: 1.4;
                flex: 1;
            }
            .article-title a {
                color: inherit;
                text-decoration: none;
            }
            .article-title a:hover {
                color: var(--accent);
            }
            .article-meta {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-bottom: 12px;
                font-size: 12px;
                color: var(--text3);
            }
            .article-source {
                display: inline-flex;
                align-items: center;
                gap: 4px;
            }
            .article-source::before {
                content: "📰";
                font-size: 11px;
            }
            .article-chars {
                display: inline-flex;
                align-items: center;
                gap: 4px;
            }
            .article-chars::before {
                content: "📝";
                font-size: 11px;
            }
            .article-snippet {
                font-size: 14px;
                line-height: 1.7;
                color: var(--text2);
                background: var(--bg);
                padding: 14px 16px;
                border-radius: var(--rs);
                border: 1px solid var(--bdr);
                white-space: pre-wrap;
                word-break: break-word;
            }
            .dash-card {
                background: var(--card);
                border-radius: var(--r);
                padding: 16px 20px;
                box-shadow: var(--sh);
                border: 1px solid var(--bdr);
                margin-bottom: 24px;
            }
            .dash-title {
                font-size: 13px;
                font-weight: 700;
                color: var(--text);
                margin-bottom: 8px;
            }
            .empty {
                text-align: center;
                padding: 80px 20px;
                color: var(--text3);
            }
            .empty-icon {
                font-size: 48px;
                margin-bottom: 12px;
            }
            @media (max-width: 860px) {
                .layout {
                    display: flex;
                    flex-direction: column;
                    height: 100vh;
                    grid-template-columns: unset;
                    grid-template-rows: unset;
                }
                .sidebar {
                    border-left: none;
                    border-bottom: 1px solid var(--bdr);
                    display: flex;
                    flex-direction: row;
                    align-items: center;
                    overflow: visible;
                    padding: 0;
                    gap: 0;
                    flex-shrink: 0;
                    background: var(--card);
                    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
                }
                .side-section {
                    padding: 8px 10px;
                    border-bottom: none;
                    display: flex;
                    align-items: center;
                    gap: 6px;
                    white-space: nowrap;
                    flex-shrink: 0;
                    border-right: 1px solid var(--bdr);
                }
                .side-label {
                    display: none;
                }
                .date-list {
                    display: flex;
                    gap: 4px;
                    overflow-x: auto;
                    -webkit-overflow-scrolling: touch;
                    padding: 6px 8px;
                    flex: 1;
                    min-width: 0;
                    scrollbar-width: none;
                }
                .date-list::-webkit-scrollbar {
                    display: none;
                }
                .date-item {
                    padding: 5px 10px;
                    font-size: 12px;
                    white-space: nowrap;
                    flex-shrink: 0;
                    border-radius: var(--rs);
                    gap: 4px;
                    color: var(--text2);
                }
                .nav-bar {
                    padding: 8px 10px;
                    gap: 4px;
                }
                .nav-title {
                    font-size: 13px;
                }
                .nav-link {
                    font-size: 11px;
                    padding: 4px 8px;
                }
                .main {
                    padding: 12px 10px 24px;
                }
                .article-card {
                    padding: 14px 16px;
                }
                .article-title {
                    font-size: 14px;
                }
                .article-snippet {
                    font-size: 13px;
                    padding: 12px 14px;
                }
                .date-icon {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="layout">
            <nav class="nav-bar">
                <span class="nav-title">⭐ nase.me</span>
                <a class="nav-link" href="index.html"
                    ><span class="nav-link-icon">🤖</span>AI 分析</a
                >
                <a class="nav-link active" href="articles.html"
                    ><span class="nav-link-icon">⭐</span>精选文章</a
                >
                <a class="nav-link" href="news.html"
                    ><span class="nav-link-icon">📰</span>新闻列表</a
                >
            </nav>
            <div class="main" id="main">
                <div class="sk-card sk">
                    <div class="sk-line w45"></div>
                    <div class="sk-line"></div>
                    <div class="sk-line w80"></div>
                </div>
            </div>
            <aside class="sidebar" id="sidebar">
                <div class="side-section">
                    <div class="side-label">📅 日期</div>
                </div>
                <div class="date-list" id="dateList"></div>
            </aside>
        </div>
        <script src="js/common.js"></script>
        <script>
            const main = $("main"),
                dateList = $("dateList");
            const S = { date: "" };

            // 渲染文章列表
            function renderArticles(articles) {
                let html = "";
                for (const it of articles) {
                    const tierClass = `tier-${it.tier || 3}`;
                    const tierLabel = `T${it.tier || 3}`;
                    const href = it.link ? safeHref(it.link) : "";
                    const titleHtml = href
                        ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                        : esc(it.title);
                    const snippet = it.snippet
                        ? esc(it.snippet).slice(0, 2000)
                        : "";

                    html += `<div class="article-card">
        <div class="article-head">
          <span class="article-tier ${tierClass}">${tierLabel}</span>
          <span class="article-title">${titleHtml}</span>
        </div>
        <div class="article-meta">
          <span class="article-source">${esc(it.source || "")}</span>
          <span class="article-chars">${it.chars || 0} 字</span>
        </div>${snippet ? `\n        <div class="article-snippet">${snippet}</div>` : ""}
      </div>`;
                }
                return html;
            }

            async function loadArticlesByDate(date) {
                if (!date) return;
                main.innerHTML =
                    '<div class="sk-card sk"><div class="sk-line w45"></div><div class="sk-line"></div><div class="sk-line w80"></div></div>';
                const articles = await fetchT(`data/news/articles/${date}.json`)
                    .then((r) => r.json())
                    .catch(() => null);
                renderPage(articles);
            }

            function renderPage(articles) {
                if (!articles || !articles.items || !articles.items.length) {
                    main.innerHTML =
                        '<div class="empty"><div class="empty-icon">📭</div><p>暂无精选文章</p></div>';
                    return;
                }

                main.innerHTML = renderArticles(articles.items);
            }

            async function init() {
                const dates = await fetchT("data/news/articles/index.json")
                    .then((r) => r.json())
                    .catch(() => null);

                // Build sidebar dates
                if (dates && dates.length) {
                    const frag = document.createDocumentFragment();
                    for (const d of dates) {
                        const el = document.createElement("div");
                        el.className = "date-item";
                        el.dataset.date = d;
                        el.innerHTML = `<span class="date-icon">📅</span><span class="date-name">${esc(d)}</span>`;
                        frag.appendChild(el);
                    }
                    dateList.appendChild(frag);
                    // Default: latest date
                    S.date = dates[0];
                    dateList
                        .querySelector(".date-item")
                        ?.classList.add("active");
                    // Load articles for latest date
                    const articles = await fetchT(
                        `data/news/articles/${S.date}.json`,
                    )
                        .then((r) => r.json())
                        .catch(() => null);
                    renderPage(articles);
                } else {
                    // Fallback: load from articles.json
                    const articles = await fetchT("data/news/articles.json")
                        .then((r) => r.json())
                        .catch(() => null);
                    renderPage(articles);
                }
            }

            dateList.onclick = (e) => {
                const item = e.target.closest(".date-item");
                if (!item || item.dataset.date === S.date) return;
                S.date = item.dataset.date;
                dateList
                    .querySelectorAll(".date-item")
                    .forEach((el) =>
                        el.classList.toggle(
                            "active",
                            el.dataset.date === S.date,
                        ),
                    );
                loadArticlesByDate(S.date);
            };

            init();
            if ("serviceWorker" in navigator)
                navigator.serviceWorker.register("js/sw.js").catch(() => {});
        </script>
    </body>
</html>
