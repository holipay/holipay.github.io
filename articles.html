<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>精选文章 - nase.me</title>
        <meta
            name="description"
            content="nase.me 精选金融、科技、社科资讯文章"
        />
        <link rel="stylesheet" href="common.css" />
        <style>
            .layout {
                max-width: 960px;
                margin: 0 auto;
                height: 100vh;
                display: flex;
                flex-direction: column;
            }
            .main {
                overflow-y: auto;
                padding: 24px 28px 40px;
                flex: 1;
                contain: layout style;
            }
            .keyword-group {
                margin-bottom: 28px;
            }
            .keyword-header {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 14px;
                padding-bottom: 10px;
                border-bottom: 2px solid var(--accent);
            }
            .keyword-tag {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                padding: 4px 12px;
                background: rgba(239,68,68,.08);
                color: #ef4444;
                border: 1px solid rgba(239,68,68,.2);
                border-radius: 100px;
                font-size: 14px;
                font-weight: 700;
            }
            .keyword-score {
                font-size: 11px;
                opacity: .6;
                margin-left: 2px;
            }
            .keyword-count {
                font-size: 11px;
                color: var(--text3);
                margin-left: auto;
            }
            .article-card {
                background: var(--card);
                border-radius: var(--r);
                padding: 18px 22px;
                box-shadow: var(--sh);
                border: 1px solid var(--bdr);
                margin-bottom: 16px;
                transition: border-color .2s;
            }
            .article-card:hover {
                border-color: var(--accent);
            }
            .article-head {
                display: flex;
                align-items: flex-start;
                gap: 10px;
                margin-bottom: 10px;
            }
            .article-tier {
                flex-shrink: 0;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 28px;
                height: 28px;
                border-radius: 8px;
                font-size: 12px;
                font-weight: 700;
            }
            .tier-1 {
                background: rgba(239,68,68,.1);
                color: #ef4444;
            }
            .tier-2 {
                background: rgba(245,158,11,.1);
                color: #f59e0b;
            }
            .tier-3 {
                background: rgba(107,114,128,.1);
                color: #6b7280;
            }
            .article-title {
                font-size: 15px;
                font-weight: 600;
                color: var(--text);
                line-height: 1.4;
                flex: 1;
            }
            .article-title a {
                color: inherit;
                text-decoration: none;
            }
            .article-title a:hover {
                color: var(--accent);
            }
            .article-meta {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-bottom: 12px;
                font-size: 12px;
                color: var(--text3);
            }
            .article-source {
                display: inline-flex;
                align-items: center;
                gap: 4px;
            }
            .article-source::before {
                content: "📰";
                font-size: 11px;
            }
            .article-chars {
                display: inline-flex;
                align-items: center;
                gap: 4px;
            }
            .article-chars::before {
                content: "📝";
                font-size: 11px;
            }
            .article-snippet {
                font-size: 14px;
                line-height: 1.7;
                color: var(--text2);
                background: var(--bg);
                padding: 14px 16px;
                border-radius: var(--rs);
                border: 1px solid var(--bdr);
                max-height: 300px;
                overflow-y: auto;
                white-space: pre-wrap;
                word-break: break-word;
            }
            .article-snippet::-webkit-scrollbar {
                width: 4px;
            }
            .article-snippet::-webkit-scrollbar-thumb {
                background: var(--bdr);
                border-radius: 4px;
            }
            .dash-card {
                background: var(--card);
                border-radius: var(--r);
                padding: 16px 20px;
                box-shadow: var(--sh);
                border: 1px solid var(--bdr);
                margin-bottom: 24px;
            }
            .dash-title {
                font-size: 13px;
                font-weight: 700;
                color: var(--text);
                margin-bottom: 8px;
            }
            .empty {
                text-align: center;
                padding: 60px 20px;
                color: var(--text3);
            }
            .empty-icon {
                font-size: 48px;
                margin-bottom: 12px;
            }
            @media (max-width: 860px) {
                .nav-bar {
                    padding: 8px 10px;
                    gap: 4px;
                }
                .nav-title {
                    font-size: 13px;
                }
                .nav-link {
                    font-size: 11px;
                    padding: 4px 8px;
                }
                .main {
                    padding: 16px 14px 32px;
                }
                .article-card {
                    padding: 14px 16px;
                }
                .article-title {
                    font-size: 14px;
                }
                .article-snippet {
                    font-size: 13px;
                    padding: 12px 14px;
                    max-height: 200px;
                }
            }
        </style>
    </head>
    <body>
        <div class="layout">
            <nav class="nav-bar">
                <span class="nav-title">⭐ nase.me</span>
                <a class="nav-link" href="index.html"
                    ><span class="nav-link-icon">🤖</span>AI 分析</a
                >
                <a class="nav-link" href="news.html"
                    ><span class="nav-link-icon">📰</span>新闻列表</a
                >
                <a class="nav-link active" href="articles.html"
                    ><span class="nav-link-icon">⭐</span>精选文章</a
                >
            </nav>
            <div class="main" id="main">
                <div class="sk-card sk">
                    <div class="sk-line w45"></div>
                    <div class="sk-line"></div>
                    <div class="sk-line w80"></div>
                </div>
            </div>
        </div>
        <button id="toTop" title="回到顶部">↑</button>
        <script src="js/common.js"></script>
        <script>
            const main = $("main");

            // 按热词分组渲染
            function renderByKeyword(articles) {
                // 按 keyword 分组
                const groups = new Map();
                for (const item of articles) {
                    const kw = item.keyword || "其他";
                    if (!groups.has(kw)) groups.set(kw, []);
                    groups.get(kw).push(item);
                }

                // 按热词分数排序（取每组第一个的 score）
                const sorted = [...groups.entries()].sort(
                    (a, b) => (b[1][0]?.score || 0) - (a[1][0]?.score || 0),
                );

                let html = "";
                for (const [keyword, items] of sorted) {
                    const score = items[0]?.score || 0;
                    html += `<div class="keyword-group">
      <div class="keyword-header">
        <span class="keyword-tag">🔥 ${esc(keyword)}<span class="keyword-score">${score}</span></span>
        <span class="keyword-count">${items.length} 篇</span>
      </div>`;

                    for (const it of items) {
                        const tierClass = `tier-${it.tier || 3}`;
                        const tierLabel = `T${it.tier || 3}`;
                        const href = it.link ? safeHref(it.link) : "";
                        const titleHtml = href
                            ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                            : esc(it.title);
                        const snippet = it.snippet
                            ? esc(it.snippet).slice(0, 2000)
                            : "";

                        html += `<div class="article-card">
          <div class="article-head">
            <span class="article-tier ${tierClass}">${tierLabel}</span>
            <span class="article-title">${titleHtml}</span>
          </div>
          <div class="article-meta">
            <span class="article-source">${esc(it.source || "")}</span>
            <span class="article-chars">${it.chars || 0} 字</span>
          </div>${snippet ? `\n          <div class="article-snippet">${snippet}</div>` : ""}
        </div>`;
                    }

                    html += "</div>";
                }

                return html;
            }

            async function init() {
                // Load articles and dashboard in parallel
                const [articles, dash] = await Promise.all([
                    fetchT("data/news/articles.json")
                        .then((r) => r.json())
                        .catch(() => null),
                    fetchT("data/news/dashboard.json")
                        .then((r) => r.json())
                        .catch(() => null),
                ]);

                if (
                    !articles ||
                    !articles.items ||
                    !articles.items.length
                ) {
                    main.innerHTML =
                        '<div class="empty"><div class="empty-icon">📭</div><p>暂无精选文章</p></div>';
                    return;
                }

                // Dashboard summary
                let dashHtml = "";
                if (dash && dash.days && dash.days.length) {
                    const today = dash.days[dash.days.length - 1];
                    const smI =
                        { 看涨: "📈", 看跌: "📉", 分化: "🔀" }[
                            today.sentiment
                        ] || "➡️";
                    const rkI =
                        { 高: "🔴", 中: "🟡", 低: "🟢" }[today.riskLevel] ||
                        "🟡";
                    const themes = (today.keyThemes || [])
                        .slice(0, 4)
                        .map((t) => `<span class="tag">${esc(t)}</span>`)
                        .join("");
                    dashHtml = `<div class="dash-card">
      <div class="dash-title">📊 ${today.date} 市场信号</div>
      <div class="a-tags"><span class="badge badge-${{ 看涨: "up", 看跌: "down", 分化: "mix" }[today.sentiment] || "flat"}">${smI} ${today.sentiment}</span><span class="badge badge-risk-${{ 高: "h", 中: "m", 低: "l" }[today.riskLevel] || "m"}">${rkI} 风险${today.riskLevel}</span>${themes}</div>
    </div>`;
                }

                const articlesHtml = renderByKeyword(articles.items);
                main.innerHTML = dashHtml + articlesHtml;
            }

            // Back to top
            const toTop = document.getElementById("toTop");
            if (toTop) {
                main.addEventListener(
                    "scroll",
                    () => {
                        toTop.classList.toggle("visible", main.scrollTop > 300);
                    },
                    { passive: true },
                );
                toTop.addEventListener("click", () =>
                    main.scrollTo({ top: 0, behavior: "smooth" }),
                );
            }

            init();
            if ("serviceWorker" in navigator)
                navigator.serviceWorker.register("js/sw.js").catch(() => {});
        </script>
    </body>
</html>
